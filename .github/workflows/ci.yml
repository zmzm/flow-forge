name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create environment without UI dependencies
        run: python -m venv .venv
      - name: Compile and test headless installation
        run: .venv/bin/python scripts/check.py --stdlib-only

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install development and UI dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint, format, type-check, compile and test including the UI
        run: python scripts/check.py

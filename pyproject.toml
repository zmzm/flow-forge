[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = ["flowforge"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = [
    "flowforge_agents.py",
    "flowforge_cli.py",
    "flowforge_config.py",
    "flowforge_execution.py",
    "flowforge_inspection.py",
    "flowforge_models.py",
    "flowforge_opencode.py",
    "flowforge_status.py",
    "flowforge_storage.py",
    "flowforge_sync.py",
    "flowforge_ui.py",
    "flowforge_workflows.py",
    "flowforge_watch.py",
    "pipeline_runner.py",
    "headless_runner.py",
    "notifications",
    "scripts/check.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["flowforge_models", "flowforge_storage", "flowforge_workflows", "flowforge_opencode"]
disallow_untyped_defs = true
